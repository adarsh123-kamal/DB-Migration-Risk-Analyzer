name: CI

on:
  push:
  pull_request:

jobs:
  test-and-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Smoke-test dashboard startup on Linux
        shell: bash
        run: |
          streamlit run dashboard.py --server.port 8501 > /tmp/streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              echo
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/streamlit.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          echo "Streamlit did not become healthy within 30 seconds."
          exit 1
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Analyze safe sample
        run: python main.py analyze test_files/safe_migration.sql
      - name: Verify high-risk migrations fail the CI threshold
        shell: bash
        run: |
          set +e
          python main.py analyze test_files/risky_migration.sql --fail-on high
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected --fail-on high to exit with status 1; received $status"
            exit 1
          fi
