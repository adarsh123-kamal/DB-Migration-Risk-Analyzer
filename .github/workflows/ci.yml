name: CI

on:
  push:
  pull_request:

jobs:
  test-and-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Analyze safe sample
        run: python main.py analyze test_files/safe_migration.sql
      - name: Verify high-risk migrations fail the CI threshold
        shell: bash
        run: |
          set +e
          python main.py analyze test_files/risky_migration.sql --fail-on high
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected --fail-on high to exit with status 1; received $status"
            exit 1
          fi
